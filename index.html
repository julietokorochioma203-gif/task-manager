<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Stylish To‑Do List</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="app">
        <header class="app-header">
            <h1>To‑Do List</h1>
            <p class="subtitle">Manage your day — simple & stylish</p>
        </header>

        <form id="task-form" class="task-form" novalidate>
            <div id="input-wrap" class="input-wrap">
                <input id="task-input" type="text" placeholder="Add a new task..." autocomplete="off" />
                <div id="validation-msg" class="validation-msg"></div>
            </div><br /> <br />
            <button id="add-task-button" type="submit">Add Task</button>
        </form>

        <div class="summary">
            <span id="task-count">Total Tasks: 0</span>
        </div>

        <ul id="task-list" class="task-list" aria-live="polite"></ul>
    </main>

    <script src="script.js"></script>
</body>
</html>
